name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: [ 'main', 'dev' ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read
  actions: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # نسخة التجربة (Debug) — Universal
  # ─────────────────────────────────────────────────────────────
  build_debug:
    name: Build Debug (universal)
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate translation contributor credits
        run: python scripts/generate_translation_contributors.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve build hash
        id: build_hash
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = "refs/heads/dev" ]; then
            echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleGmsMobileUniversalDebug
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}
          NIGHTLY_BUILD_HASH: ${{ steps.build_hash.outputs.value }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-universal
          path: |
            app/build/outputs/apk/mobile/universal/debug/*.apk
            app/build/outputs/apk/gmsMobileUniversal/debug/*.apk
            app/build/outputs/apk/gms/mobile/universal/debug/*.apk
            app/build/outputs/apk/mobileUniversal/debug/*.apk

  # ─────────────────────────────────────────────────────────────
  # النسخة النهائية (Release) — Universal, بدون توقيع
  # ─────────────────────────────────────────────────────────────
  build_release:
    name: Build Release (universal, unsigned)
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest

    # Required for 'gh release create' inside this job. The workflow-
    # level permissions block above declares contents: read for
    # security; this job needs write access to create the draft
    # release and upload its assets. GITHUB_TOKEN cannot receive the
    # 'workflows' permission, so we scope the write grant here rather
    # than globally.
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate translation contributor credits
        run: python scripts/generate_translation_contributors.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve build hash
        id: build_hash
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = "refs/heads/dev" ]; then
            echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not configured."
            exit 1
          fi
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          chmod 600 app/keystore/release.keystore
          echo "Keystore decoded:"
          ls -la app/keystore/

      - name: Build Release APK
        run: ./gradlew assembleGmsMobileUniversalRelease
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}
          NIGHTLY_BUILD_HASH: ${{ steps.build_hash.outputs.value }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Resolve release output directory
        id: release_dir
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATES=(
            "app/build/outputs/apk/gmsMobileUniversal/release"
            "app/build/outputs/apk/gms/mobile/universal/release"
            "app/build/outputs/apk/mobile/universal/release"
            "app/build/outputs/apk/mobileUniversal/release"
          )
          for d in "${CANDIDATES[@]}"; do
            if [ -d "$d" ]; then
              echo "release_dir=$d" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          # fallback: any release dir
          FOUND="$(find app/build/outputs/apk -type f -name "*.apk" -path "*universal*release*" | head -n 1 || true)"
          if [ -n "$FOUND" ]; then
            echo "release_dir=$(dirname "$FOUND")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Could not resolve release output dir"
          find app/build/outputs/apk -maxdepth 6 -type d -print || true
          exit 1

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v7
        with:
          name: app-release-universal-signed
          path: ${{ steps.release_dir.outputs.release_dir }}/*.apk

      # ─────────────────────────────────────────────────────────────
      # Auto-draft release
      # ─────────────────────────────────────────────────────────────
      # After a successful signed build on main, create a DRAFT GitHub
      # release tagged v<versionName> with the APK already attached.
      # The draft appears in the Releases page waiting for you to
      # review and click "Publish release".
      #
      # If a release or draft for the same tag already exists, the step
      # is a no-op. Bump versionName in build.gradle.kts to trigger a
      # new draft.
      - name: Create draft GitHub release
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(grep -m1 -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || true)
          if [ -z "$VERSION" ]; then
            echo "::warning::Could not read versionName from build.gradle.kts"
            exit 0
          fi

          TAG="v${VERSION}"
          echo "Detected version: $VERSION  →  tag: $TAG"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release or draft $TAG already exists — skipping."
            exit 0
          fi

          APK_DIR="${{ steps.release_dir.outputs.release_dir }}"
          if [ ! -d "$APK_DIR" ]; then
            echo "::warning::APK directory not found: $APK_DIR"
            exit 0
          fi

          mapfile -t APKS < <(find "$APK_DIR" -name '*.apk')
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::warning::No APKs found in $APK_DIR"
            exit 0
          fi

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "ArchiveTune S ${TAG}" \
            --generate-notes \
            --draft \
            "${APKS[@]}"

          echo "Draft release $TAG created with ${#APKS[@]} APK(s)."
          echo "Review it at: https://github.com/${{ github.repository }}/releases"

          # Optional: ping the Actions summary
          echo "### Draft created" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open Releases page](https://github.com/${{ github.repository }}/releases)" >> "$GITHUB_STEP_SUMMARY" 

name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: [ 'main', 'dev' ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read
  actions: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Debug (universal)
  # ─────────────────────────────────────────────────────────────
  build_debug:
    name: Build Debug (universal)
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate translation contributor credits
        run: python scripts/generate_translation_contributors.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve build hash
        id: build_hash
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = "refs/heads/dev" ]; then
            echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleGmsMobileUniversalDebug
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}
          NIGHTLY_BUILD_HASH: ${{ steps.build_hash.outputs.value }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-universal
          path: |
            app/build/outputs/apk/mobile/universal/debug/*.apk
            app/build/outputs/apk/gmsMobileUniversal/debug/*.apk
            app/build/outputs/apk/gms/mobile/universal/debug/*.apk
            app/build/outputs/apk/mobileUniversal/debug/*.apk

  # ─────────────────────────────────────────────────────────────
  # Release — one parallel job per ABI
  # ─────────────────────────────────────────────────────────────
  build_release_arm64:
    name: Release arm64-v8a
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true, fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - run: python scripts/generate_translation_contributors.py
      - uses: actions/setup-java@v5
        with: { java-version: '21', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v6
        with: { cache-cleanup: on-success, cache-read-only: false }
      - run: chmod +x gradlew
      - name: Decode release keystore
        shell: bash
        env: { KEYSTORE_BASE64: '${{ secrets.KEYSTORE_BASE64 }}' }
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not configured."
            exit 1
          fi
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          chmod 600 app/keystore/release.keystore
      - name: Build arm64-v8a
        run: ./gradlew assembleGmsMobileArm64Release
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: apk-arm64
          path: app/build/outputs/apk/gms/mobile/arm64/release/*.apk
          if-no-files-found: error

  build_release_armeabi:
    name: Release armeabi-v7a
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true, fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - run: python scripts/generate_translation_contributors.py
      - uses: actions/setup-java@v5
        with: { java-version: '21', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v6
        with: { cache-cleanup: on-success, cache-read-only: false }
      - run: chmod +x gradlew
      - name: Decode release keystore
        shell: bash
        env: { KEYSTORE_BASE64: '${{ secrets.KEYSTORE_BASE64 }}' }
        run: |
          set -euo pipefail
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          chmod 600 app/keystore/release.keystore
      - name: Build armeabi-v7a
        run: ./gradlew assembleGmsMobileArmeabiRelease
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: apk-armeabi
          path: app/build/outputs/apk/gms/mobile/armeabi/release/*.apk
          if-no-files-found: error

  build_release_x86_64:
    name: Release x86_64
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true, fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - run: python scripts/generate_translation_contributors.py
      - uses: actions/setup-java@v5
        with: { java-version: '21', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v6
        with: { cache-cleanup: on-success, cache-read-only: false }
      - run: chmod +x gradlew
      - name: Decode release keystore
        shell: bash
        env: { KEYSTORE_BASE64: '${{ secrets.KEYSTORE_BASE64 }}' }
        run: |
          set -euo pipefail
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          chmod 600 app/keystore/release.keystore
      - name: Build x86_64
        run: ./gradlew assembleGmsMobileX86_64Release
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: apk-x86_64
          path: app/build/outputs/apk/gms/mobile/x86_64/release/*.apk
          if-no-files-found: error

  build_release_universal:
    name: Release universal
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true, fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - run: python scripts/generate_translation_contributors.py
      - uses: actions/setup-java@v5
        with: { java-version: '21', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v6
        with: { cache-cleanup: on-success, cache-read-only: false }
      - run: chmod +x gradlew
      - name: Decode release keystore
        shell: bash
        env: { KEYSTORE_BASE64: '${{ secrets.KEYSTORE_BASE64 }}' }
        run: |
          set -euo pipefail
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          chmod 600 app/keystore/release.keystore
      - name: Build universal
        run: ./gradlew assembleGmsMobileUniversalRelease
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: apk-universal
          path: app/build/outputs/apk/gms/mobile/universal/release/*.apk
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Aggregate and publish draft release
  # ─────────────────────────────────────────────────────────────
  create_release:
    name: Create draft release
    needs:
      - build_release_arm64
      - build_release_armeabi
      - build_release_x86_64
      - build_release_universal
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { sparse-checkout: app/build.gradle.kts, sparse-checkout-cone-mode: false }

      - name: Download all APK artifacts
        uses: actions/download-artifact@v7
        with:
          path: apks
          merge-multiple: true

      - name: Rename APKs
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}"
          mkdir -p out
          for apk in apks/*.apk; do
            name=$(basename "$apk")
            arch=""
            case "$name" in
              *arm64*) arch="arm64" ;;
              *armeabi*) arch="armeabi" ;;
              *x86_64*) arch="x86_64" ;;
              *universal*) arch="universal" ;;
            esac
            if [ -z "$arch" ]; then
              echo "::warning::Could not detect arch for $name"
              continue
            fi
            cp "$apk" "out/ArchiveTune S ${TAG} ${arch}.apk"
          done
          echo "Renamed APKs:"
          ls -lh out/

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}"
          echo "Detected version: $VERSION  →  tag: $TAG"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release or draft $TAG already exists — skipping."
            exit 0
          fi

          mapfile -t APKS < <(find out -name '*.apk')
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No APKs found in out/"
            exit 1
          fi

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "ArchiveTune S ${TAG}" \
            --generate-notes \
            --draft \
            "${APKS[@]}"

          echo "Draft release $TAG created with ${#APKS[@]} APK(s)."

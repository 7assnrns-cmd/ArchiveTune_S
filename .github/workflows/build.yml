name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: [ 'main', 'dev' ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read
  actions: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Debug (universal)
  # ─────────────────────────────────────────────────────────────
  build_debug:
    name: Build Debug (universal)
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true, fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - run: python scripts/generate_translation_contributors.py
      - uses: actions/setup-java@v5
        with: { java-version: '21', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v6
        with: { cache-cleanup: on-success, cache-read-only: false }
      - run: chmod +x gradlew
      - name: Resolve build hash
        id: build_hash
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = "refs/heads/dev" ]; then
            echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Debug APK
        run: ./gradlew assembleGmsMobileUniversalDebug
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}
          NIGHTLY_BUILD_HASH: ${{ steps.build_hash.outputs.value }}
      - name: Collect debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out-debug
          found=$(find app/build/outputs/apk -type f -name "*.apk" | head -1 || true)
          if [ -z "$found" ]; then
            echo "::error::No debug APK found under app/build/outputs/apk"
            find app/build/outputs/apk -maxdepth 5 -type d | head -40
            exit 1
          fi
          cp "$found" /tmp/out-debug/
          ls -lh /tmp/out-debug/
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-universal
          path: /tmp/out-debug/*.apk
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Release — one matrix job, 4 parallel builds
  # ─────────────────────────────────────────────────────────────
  build_release:
    name: Release ${{ matrix.label }}
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64-v8a
            abi: arm64
            gradle_task: assembleGmsMobileArm64Release
          - label: armeabi-v7a
            abi: armeabi
            gradle_task: assembleGmsMobileArmeabiRelease
          - label: x86_64
            abi: x86_64
            gradle_task: assembleGmsMobileX86_64Release
          - label: universal
            abi: universal
            gradle_task: assembleGmsMobileUniversalRelease
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true, fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - run: python scripts/generate_translation_contributors.py
      - uses: actions/setup-java@v5
        with: { java-version: '21', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v6
        with: { cache-cleanup: on-success, cache-read-only: false }
      - run: chmod +x gradlew
      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not configured."
            exit 1
          fi
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          chmod 600 app/keystore/release.keystore
      - name: Build ${{ matrix.label }}
        shell: bash
        run: |
          set -e
          # Retry once on transient Maven Central hiccups (parallel jobs
          # occasionally race the same dependency download).
          ./gradlew ${{ matrix.gradle_task }} \
            || ./gradlew ${{ matrix.gradle_task }}
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Collect ${{ matrix.label }} APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out-${{ matrix.abi }}
          # AGP produces the APK at one of several possible paths depending
          # on the plugin version. Search rather than hardcoding.
          found=$(find app/build/outputs/apk -type f \
            -name "app-*-${{ matrix.abi }}-release.apk" \
            | head -1 || true)
          if [ -z "$found" ]; then
            found=$(find app/build/outputs/apk -type f -name "*.apk" | head -1 || true)
          fi
          if [ -z "$found" ]; then
            echo "::error::No ${{ matrix.label }} APK found under app/build/outputs/apk"
            find app/build/outputs/apk -maxdepth 5 -type d | head -40
            exit 1
          fi
          echo "Found: $found"
          cp "$found" /tmp/out-${{ matrix.abi }}/
          ls -lh /tmp/out-${{ matrix.abi }}/
      - uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.abi }}
          path: /tmp/out-${{ matrix.abi }}/*.apk
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Aggregate and publish draft release
  # ─────────────────────────────────────────────────────────────
  create_release:
    name: Create draft release
    needs: build_release
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all APK artifacts
        uses: actions/download-artifact@v7
        with:
          path: apks
          merge-multiple: true

      - name: Rename APKs
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}"
          mkdir -p out
          for apk in apks/*.apk; do
            [ -f "$apk" ] || continue
            name=$(basename "$apk")
            arch=""
            case "$name" in
              *arm64*) arch="arm64" ;;
              *armeabi*) arch="armeabi" ;;
              *x86_64*) arch="x86_64" ;;
              *universal*) arch="universal" ;;
            esac
            if [ -z "$arch" ]; then
              echo "::warning::Could not detect arch for $name"
              continue
            fi
            cp "$apk" "out/ArchiveTune S ${TAG} ${arch}.apk"
            # Backward-compatible alias so older apps (<= v1.2.8) can still
            # find the asset under the previous naming scheme. Drop this in
            # v1.4.0 once most installs are on v1.3.x.
            cp "$apk" "out/app-gms-mobile-${arch}-release.apk"
          done
          echo "Renamed APKs:"
          ls -lh out/

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}"
          echo "Detected version: $VERSION  →  tag: $TAG"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release or draft $TAG already exists — skipping."
            exit 0
          fi

          mapfile -t APKS < <(find out -name '*.apk')
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No APKs found in out/"
            exit 1
          fi

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "ArchiveTune S ${TAG}" \
            --generate-notes \
            --draft \
            "${APKS[@]}"

          echo "Draft release $TAG created with ${#APKS[@]} APK(s)."
